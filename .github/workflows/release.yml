name: Release App
on:
  push:
    tags:
      - 'v*'
      - 'dev-v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate tag channel, source branch, and version
        run: node scripts/validate-release-tag.mjs

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # 2. 核心优化：如果是 Mac，在极速服务器上同时安装 Intel 和 Apple Silicon 编译依赖
      - name: Install Rust targets (macOS only)
        if: matrix.platform == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-cargo

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish channel release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ startsWith(github.ref_name, 'dev-v') && format('ReqFlow Development {0}', github.ref_name) || format('ReqFlow {0}', github.ref_name) }}
          releaseBody: ${{ startsWith(github.ref_name, 'dev-v') && 'ReqFlow development build. This prerelease is built from the dev branch.' || 'ReqFlow stable desktop release. This draft is built from the main branch.' }}
          releaseAssetNamePattern: 'ReqFlow-${{ github.ref_name }}-[platform]-[arch][ext]'
          releaseDraft: ${{ !startsWith(github.ref_name, 'dev-v') }}
          prerelease: ${{ startsWith(github.ref_name, 'dev-v') }}
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }} ${{ startsWith(github.ref_name, 'dev-v') && '--config src-tauri/tauri.dev.conf.json' || '' }}
